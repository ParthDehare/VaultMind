name: VaultMind CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-check:
    name: Lint and Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f server/requirements.txt ]; then pip install -r server/requirements.txt; fi

      - name: Lint with flake8
        run: |
          # max-line-length 120, ignore E501 (line too long) and W503 (line break before binary operator)
          flake8 . --count --max-line-length=120 --ignore=E501,W503 --show-source --statistics

      - name: Basic syntax check
        run: |
          python -m compileall -q .

  verify-docker-compose:
    name: Verify Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose config > /dev/null
            echo "docker-compose.yml is valid."
          else
            echo "docker-compose.yml not found, skipping."
          fi
