
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # This service ensures the required topic exists before starting producers/consumers
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      - kafka
    command: >
      bash -c "
        echo 'Waiting for Kafka to be ready...' &&
        cub kafka-ready -b kafka:29092 1 30 &&
        kafka-topics --create --topic live-transactions --partitions 1 --replication-factor 1 --if-not-exists --bootstrap-server kafka:29092 &&
        echo 'Topic live-transactions created successfully!'
      "

  redis:
    image: redis:alpine
    container_name: vaultmind_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
      network: host
    container_name: vaultmind_api
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BROKER=kafka:29092
      - REDIS_HOST=redis
      - ALLOWED_ORIGINS=http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178
    env_file:
      - ./server/.env
    depends_on:
      - kafka
      - kafka-init
      - redis
    volumes:
      - ./server:/app

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      network: host
    container_name: vaultmind_web
    ports:
      - "8080:80"
    depends_on:
      - backend

  producer:
    build:
      context: .
      dockerfile: Dockerfile.api
      network: host
    container_name: vaultmind_demo_producer
    command: python start_kafka_demo.py
    environment:
      - KAFKA_BROKER=kafka:29092
    depends_on:
      - kafka
      - kafka-init
      - backend
    volumes:
      - .:/app
